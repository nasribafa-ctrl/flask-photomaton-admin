{% extends 'base.html' %}

{% block title %}{{name}}{% endblock %}

{% block body %}
    <div class="container mt-4">
        <form method="post" class="needs-validation" novalidate>
            <div class="card shadow-sm">
                <div class="card-header bg-light">
                    <h5 class="mb-0">Add Configuration</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <!-- Left Column -->
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="imagePath" class="form-label">Image Path</label>
                                <input type="text" class="form-control" id="imagePath" name="imagePath" required>
                                <div class="invalid-feedback">Veillez renseigner le chemin vers l'image.</div>
                            </div>
                            <div class="mb-3">
                                <label for="posX" class="form-label">Position X</label>
                                <input type="number" class="form-control" id="posX" name="posX" required>
                                <div class="invalid-feedback">veillez renseigner la Position X de l'image.</div>
                            </div>
                        </div>

                        <!-- Right Column -->
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="posY" class="form-label">Position Y</label>
                                <input type="number" class="form-control" id="posY" name="posY" required>
                                <div class="invalid-feedback">veillez renseigner la position Y de l'image.</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card-footer bg-light text-end">
                    <button type="submit" class="btn">
                        <i class="fas fa-plus-circle me-1"></i> Ajouter le Layer
                    </button>
                </div>
            </div>
        </form>
    </div>
{% endblock %}
