<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinutePapillons - Gestion Admin</title>
    <link rel="icon" href="{{url_for('static', filename='img/Minute-Papillons-2-150x150.png')}}">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/02a74f5624.js" crossorigin="anonymous"></script>
    
</head>
<body>
    <div class="register-card">
        <a href="{{ url_for('index') }}" class="close-x" title="Retour à l'accueil">
            <i class="fa-solid fa-house"></i>
        </a>
        
        <div class="film-strip"></div>
        <div class="brand-name">MinutePapillons</div>
        <div class="sub-title">Gestion des accès</div>
        
        <div class="admin-badge">
            <i class="fa-solid fa-lock me-1"></i> Panel Administrateur
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} py-2 small text-center">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}">
            <div class="mb-4">
                <div class="input-group border-bottom">
                    <span class="input-group-text bg-transparent border-0"><i class="fa-solid fa-user-plus text-muted"></i></span>
                    <input type="text" class="form-control" name="username" placeholder="Identifiant du nouvel utilisateur" required>
                </div>
            </div>
            <div class="mb-4">
                <div class="input-group border-bottom">
                    <span class="input-group-text bg-transparent border-0"><i class="fa-solid fa-key text-muted"></i></span>
                    <input type="password" class="form-control" name="password" placeholder="Définir un mot de passe" required>
                </div>
            </div>

             <div class="permissions-section">
                <span class="perm-title"><i class="fa-solid fa-shield-halved me-1"></i> Droits d'accès</span>
                <div class="perm-grid">
                    <label class="perm-item"><input type="checkbox" name="permissions[]" value="lecture" checked> Lecture</label>
                    <label class="perm-item"><input type="checkbox" name="permissions[]" value="edition"> Édition</label>
                    <label class="perm-item"><input type="checkbox" name="permissions[]" value="suppression"> Suppression</label>
                    <label class="perm-item text-danger"><input type="checkbox" name="permissions[]" value="admin"> <b>Admin</b></label>
                </div>
            </div>

            <button type="submit" class="btn-register">
                <i class="fa-solid fa-check-circle me-2"></i> Enregistrer le profil
            </button>
        </form>
        
        <div class="text-center mt-4">
            <a href="{{ url_for('index') }}" class="text-muted small" style="text-decoration: none;">
                <i class="fa-solid fa-arrow-left"></i> Annuler et revenir
            </a>
        </div>

        <div class="film-strip mt-4"></div>
        <p class="text-center mt-2 mb-0" style="font-size: 0.7rem; color: #bbb;">&copy; 2026 MinutePapillons System</p>
    </div>
</body>
</html>
