<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinutePapillons - Connexion</title>
    <link rel="icon" href="{{url_for('static', filename='img/Minute-Papillons-2-150x150.png')}}">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/02a74f5624.js" crossorigin="anonymous"></script>

    <style>
        body {
            background: #f8f9fa;
            background-image: url("https://www.transparenttextures.com/patterns/p6.png");
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 0px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border: 15px solid white; 
            position: relative;
            max-width: 400px;
            width: 90%;
            transform: rotate(-1deg);
            transition: transform 0.3s ease;
        }

        .login-card:hover {
            transform: rotate(0deg);
        }

        .brand-name {
            font-family: 'Pacifico', cursive;
            color: #d63384;
            font-size: 2.2rem;
            text-align: center;
            margin-bottom: 5px;
        }

        .sub-title {
            text-align: center;
            color: #6c757d;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        .form-control {
            border: none;
            border-bottom: 2px solid #eee;
            border-radius: 0;
            padding: 12px 5px;
            transition: all 0.3s;
        }

        .form-control:focus {
            box-shadow: none;
            border-color: #d63384;
            background-color: #fff9fb;
        }

        .btn-capture {
            background: #d63384;
            border: none;
            border-radius: 50px;
            padding: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 15px;
            transition: all 0.3s;
            color: white;
        }

        .btn-capture:hover {
            background: #b02a6b;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(214, 51, 132, 0.3);
            color: white;
        }

        .film-strip {
            height: 20px;
            background-image: radial-gradient(#333 20%, transparent 20%);
            background-size: 20px 20px;
            background-position: 0 0;
            opacity: 0.1;
            margin: 10px 0;
        }

        .close-x {
            position: absolute;
            top: -20px;
            right: -20px;
            background: #333;
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            z-index: 10;
        }

        /* Style pour le lien d'inscription */
        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
        }

        .register-link a {
            color: #d63384;
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px dashed #d63384;
            transition: 0.3s;
        }

        .register-link a:hover {
            color: #333;
            border-bottom-style: solid;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <a href="{{ url_for('index') }}" class="close-x"><i class="fa-solid fa-xmark"></i></a>
        
        <div class="film-strip"></div>
        
        <div class="brand-name">MinutePapillons</div>
        <div class="sub-title">Studio Photo</div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} py-2 small text-center">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-4 mt-2">
                <div class="input-group border-bottom">
                    <span class="input-group-text bg-transparent border-0"><i class="fa-solid fa-user text-muted"></i></span>
                    <input type="text" class="form-control" name="username" placeholder="Identifiant" required>
                </div>
            </div>
            
            <div class="mb-4">
                <div class="input-group border-bottom">
                    <span class="input-group-text bg-transparent border-0"><i class="fa-solid fa-lock text-muted"></i></span>
                    <input type="password" class="form-control" name="password" placeholder="Mot de passe" required>
                </div>
            </div>

            <button type="submit" class="btn btn-capture w-100">
                <i class="fa-solid fa-camera me-2"></i> Souriez !
            </button>
        </form>

        

        <div class="film-strip mt-4"></div>
        
        <p class="text-center mt-2 mb-0" style="font-size: 0.7rem; color: #bbb;">
            &copy; 2026 MinutePapillons System
        </p>
    </div>

</body>
</html>
